            'Lorsque vous choisissez ou capturez activement des photos et des vidéos, l’application obtient le contenu sélectionné et enregistre sa propre copie. Android utilise le sélecteur de photos du système pour accéder uniquement aux médias que vous sélectionnez ; iOS utilise le sélecteur de la photothèque. Votre photothèque d’origine et les copies de l’application sont gérées séparément.',
            'Lorsque vous générez activement une archive d’exportation, l’application la chiffre avec le mot de passe que vous définissez, puis la confie à l’interface d’enregistrement de fichiers du système. Nous ne stockons ni ne récupérons le mot de passe de sauvegarde. Si vous l’enregistrez sur un disque cloud ou l’envoyez à quelqu’un, le service de destination traite la copie externe selon ses règles.',
            'Lorsque vous partagez activement des médias, l’application prépare une copie de partage et la confie à l’interface de partage du système. L’application ou le service destinataire peut conserver cette copie ; la suppression d’un enregistrement dans l’application ne peut pas annuler le contenu que vous avez déjà partagé.',
            'Lorsque vous activez les rappels de planning, l’application enregistre le rappel auprès du système de notification de l’appareil. Lorsque vous choisissez d’écrire dans le calendrier système, le contenu de l’événement, l’heure et le prénom de l’enfant que vous choisissez d’inclure sont écrits dans le calendrier ; le compte de calendrier peut synchroniser ces informations.',
            'Lorsque vous achetez ou restaurez un déverrouillage unique, le paiement est traité par Google Play ou l’Apple App Store. L’application reçoit l’état du produit et de la transaction, mais aucune donnée de carte bancaire.',
            'La version actuelle initialise Firebase Core mais n’active pas la base de données cloud Firebase, le stockage cloud, l’analyse ni la collecte de plantages. Le SDK peut traiter des informations techniques nécessaires sur l’appareil ou l’installation ; nous concilions cela avec la version finale et maintenons cohérentes les déclarations de sécurité des données de la boutique.'
          ] },
          { type: 'text', h: 'Autorisations', p: 'L’appareil photo et le microphone permettent la capture ; l’accès à la photothèque iOS permet de sélectionner des médias ; le sélecteur de photos du système Android ne nécessite pas un accès large à la bibliothèque. Les notifications prennent en charge les rappels que vous activez, l’accès au calendrier prend en charge les entrées que vous choisissez d’ajouter, et la biométrie de l’appareil prend en charge le verrouillage optionnel de l’application. Nous ne lisons ni ne stockons de modèles d’empreintes digitales ou faciales. Vous pouvez gérer ces autorisations dans les paramètres de l’appareil.' },
          { type: 'text', h: 'Conservation, suppression et sécurité', p: 'Les enregistrements restent sur votre appareil jusqu’à ce que vous les supprimiez ou désinstalliez l’application. Les enregistrements normaux et les profils d’enfants peuvent généralement être récupérés dans les 30 jours suivant leur mise à la corbeille, et peuvent également être supprimés définitivement plus tôt. Les sauvegardes système de l’appareil et les archives d’exportation que vous enregistrez séparément peuvent conserver d’autres copies et ne disparaissent pas automatiquement en raison d’une suppression dans l’application. Nous utilisons le bac à sable de l’application du système d’exploitation pour stocker les fichiers ; les archives protégées par mot de passe utilisent un chiffrement authentifié. Veuillez conserver en sécurité les mots de passe de votre appareil et de vos archives.' },
          { type: 'text', h: 'Données des enfants', p: 'Cette application s’adresse aux parents et aux aidants, et non aux enfants qui s’inscriraient ou l’utiliseraient seuls. N’ajoutez que les informations d’enfants que vous êtes autorisé à gérer, et confirmez le destinataire et la portée avant de partager des photos, des vidéos ou des archives.' },
          { type: 'text', h: 'Contact et modifications', p: 'Si vous avez des questions sur le traitement des données, la suppression ou cette politique, veuillez envoyer un e-mail à <a href="mailto:' + EMAIL + '">' + EMAIL + '</a>. Si nous ajoutons à l’avenir des comptes, une synchronisation cloud, des analyses ou d’autres services modifiant la portée du traitement des données, nous mettrons à jour cette politique et les déclarations de la boutique avant de les activer.' }
        ]

        desc: 'Política de privacidade do app Childhood: como os registros de crescimento, mídias, backups e permissões são tratados.',
        h1: 'Childhood · Política de Privacidade',
        meta: 'Operador: Kang Kai (desenvolvedor individual) · Contato: <a href="mailto:' + EMAIL + '">' + EMAIL + '</a> · Vigência: 13 de outubro de 2026',
        intro: 'O Childhood ajuda pais e cuidadores a registrar os momentos de crescimento das crianças, medidas de crescimento, eventos e agendas. O aplicativo armazena principalmente os perfis das crianças, fotos, vídeos e registros que você insere no armazenamento privado do aplicativo no seu dispositivo atual. A versão atual não oferece login de conta nem sincronização automática em nuvem e não envia automaticamente esses registros para nossos servidores.',
        sections: [
          { type: 'list', h: 'Como os dados são tratados', items: [

            'Quando você escolhe ou captura ativamente fotos e vídeos, o aplicativo obtém o conteúdo selecionado e salva sua própria cópia. O Android usa o seletor de fotos do sistema para acessar apenas as mídias que você seleciona; o iOS usa o seletor da biblioteca de fotos. Sua biblioteca de fotos original e as cópias do aplicativo são gerenciadas separadamente.',
            'Quando você gera ativamente um pacote de exportação, o aplicativo o criptografa com a senha que você define e então o entrega à interface de salvamento de arquivos do sistema. Não armazenamos nem recuperamos a senha de backup. Se você o salvar em uma unidade na nuvem ou enviá-lo a outra pessoa, o serviço de destino trata a cópia externa de acordo com suas regras.',
            'Quando você compartilha ativamente mídias, o aplicativo prepara uma cópia de compartilhamento e a entrega à interface de compartilhamento do sistema. O aplicativo ou serviço receptor pode manter essa cópia; excluir um registro no aplicativo não pode desfazer o conteúdo que você já compartilhou.',
            'Quando você ativa os lembretes de agenda, o aplicativo registra o lembrete no sistema de notificações do dispositivo. Quando você escolhe gravar no calendário do sistema, o conteúdo do evento, a hora e o nome da criança que você escolhe incluir são gravados no calendário; a conta do calendário pode sincronizar essas informações.',
            'Quando você compra ou restaura um desbloqueio único, o pagamento é processado pelo Google Play ou pela Apple App Store. O aplicativo recebe o status do produto e da transação, mas nenhum dado de cartão de pagamento.',
            'A versão atual inicializa o Firebase Core, mas não ativa o banco de dados em nuvem do Firebase, o armazenamento em nuvem, a análise nem a coleta de falhas. O SDK pode processar informações técnicas necessárias do dispositivo ou da instalação; reconciliamos isso com a versão final e mantemos consistentes as declarações de segurança de dados da loja.'
          ] },
          { type: 'text', h: 'Permissões', p: 'A câmera e o microfone permitem a captura; o acesso à biblioteca de fotos do iOS permite selecionar mídias; o seletor de fotos do sistema do Android não exige acesso amplo à biblioteca. As notificações suportam os lembretes que você ativa, o acesso ao calendário suporta as entradas que você escolhe adicionar, e a biometria do dispositivo suporta o bloqueio opcional do aplicativo. Não lemos nem armazenamos modelos de impressões digitais ou faciais. Você pode gerenciar essas permissões nas configurações do dispositivo.' },
          { type: 'text', h: 'Retenção, exclusão e segurança', p: 'Os registros permanecem no seu dispositivo até que você os exclua ou desinstale o aplicativo. Registros normais e perfis de crianças geralmente podem ser recuperados dentro de 30 dias após entrarem na lixeira, e também podem ser excluídos permanentemente antes. Backups do sistema do dispositivo e os pacotes de exportação que você salva separadamente podem reter outras cópias e não desaparecem automaticamente devido a uma exclusão no aplicativo. Usamos o sandbox do aplicativo do sistema operacional para armazenar arquivos; pacotes protegidos por senha usam criptografia autenticada. Por favor, guarde com segurança as senhas do seu dispositivo e dos seus pacotes.' },

      'ru': {

        title: 'Childhood · Политика конфиденциальности',

        h1: 'Childhood · Политика конфиденциальности',
        meta: 'Оператор: Kang Kai (частный разработчик) · Контакт: <a href="mailto:' + EMAIL + '">' + EMAIL + '</a> · Вступает в силу: 13 октября 2026 г.',
        intro: 'Childhood помогает родителям и опекунам записывать моменты роста детей, измерения роста, события и расписания. Приложение в основном сохраняет профили детей, фотографии, видео и записи, которые вы вводите, в частном хранилище приложения на вашем текущем устройстве. Текущая версия не предоставляет входа в учётную запись или автоматической синхронизации в облаке и не загружает эти записи на наши серверы автоматически.',
        sections: [
          { type: 'list', h: 'Как мы обрабатываем данные', items: [

            'Когда вы активно выбираете или делаете фотографии и видео, приложение получает выбранное содержимое и сохраняет свою копию. Android использует системный выборщик фотографий для доступа только к выбранным медиафайлам; iOS использует выборщик фотобиблиотеки. Ваша исходная фотобиблиотека и копии приложения управляются отдельно.',

            'Когда вы активно делитесь медиафайлами, приложение готовит копию для общего доступа и передаёт её системному интерфейсу общего доступа. Принимающее приложение или сервис могут сохранить эту копию; удаление записи в приложении не может отозвать уже опубликованное вами содержимое.',

            'Когда вы покупаете или восстанавливаете одноразовую разблокировку, платёж обрабатывается Google Play или Apple App Store. Приложение получает статус товара и транзакции, но не данные банковской карты.',
            'Текущая версия инициализирует Firebase Core, но не включает облачную базу данных Firebase, облачное хранилище, аналитику или сбор сбоев. SDK может обрабатывать необходимую техническую информацию об устройстве или установке; мы сверяем это с финальной версией и поддерживаем согласованность заявлений о безопасности данных в магазине.'
          ] },
          { type: 'text', h: 'Разрешения', p: 'Камера и микрофон используются для съёмки; доступ к фотобиблиотеке iOS используется для выбора медиафайлов; системный выборщик фотографий Android не требует широкого доступа к библиотеке. Уведомления поддерживают включённые вами напоминания, доступ к календарю поддерживает записи, которые вы решаете добавить, а биометрия устройства поддерживает необязательную блокировку приложения. Мы не считываем и не сохраняем шаблоны отпечатков пальцев или лица. Эти разрешения можно управлять в настройках устройства.' },

        ]

    const LABELS = {
      'zh-CN': '语言', 'zh-TW': '語言', 'en': 'Language', 'es': 'Idioma',
      'fr': 'Langue', 'pt': 'Idioma', 'ru': 'Язык', 'ja': '言語',
      'ko': '언어', 'id': 'Bahasa', 'de': 'Sprache'
    };

    const sel = document.getElementById('langSelect');
    for (const [code, name] of LANGS) {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = name;
      sel.appendChild(opt);
    }

    function render(code) {
      const d = T[code] || T['zh-CN'];
      document.documentElement.lang = d.html;
      document.title = d.title;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', d.desc);
      document.getElementById('title').innerHTML = d.h1;
      document.getElementById('meta').innerHTML = d.meta;
      document.getElementById('langLabel').textContent = LABELS[code] || 'Language';
      document.getElementById('footer').innerHTML = '© 2026 小时候 · Childhood';

      let html = '<p>' + d.intro + '</p>';
      for (const s of d.sections) {
        if (s.type === 'list') {
          html += '<h2>' + s.h + '</h2><ul>';
          for (const it of s.items) html += '<li>' + it + '</li>';
          html += '</ul>';
        } else {
          html += '<h2>' + s.h + '</h2><p>' + s.p + '</p>';
        }
      }
      document.getElementById('content').innerHTML = html;
    }

    function setLang(code, updateUrl) {
      if (!T[code]) code = 'zh-CN';
      sel.value = code;
      render(code);
      if (updateUrl) {
        if (code === 'zh-CN') {
          history.replaceState(null, '', location.pathname + location.hash);
        } else {
          history.replaceState(null, '', '?lang=' + code);
        }
      }
    }

    sel.addEventListener('change', () => setLang(sel.value, true));

    const params = new URLSearchParams(location.search);
    const initial = params.get('lang');
    setLang(initial, false);
  </script>
